# Secrets for the admin sign-in (S13). Copy to config/secrets.yaml and fill in;
# that file is git-ignored and must never be committed.
#
# password_hash is a hash, not the password. To set a new password:
#   python -c "from werkzeug.security import generate_password_hash as h; print(h(input('Password: ')))"
# secret_key signs the sign-in cookie; changing it signs everyone out. To make one:
#   python -c "import secrets; print(secrets.token_hex(32))"

secret_key: REPLACE_ME

admin:
  username: admin
  password_hash: "REPLACE_ME"
