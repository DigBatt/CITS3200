      - { latitude: -31.9780682, longitude: 115.8183198 }
      - { latitude: -31.9785097, longitude: 115.8183251 }
      - { latitude: -31.9791196, longitude: 115.8183251 }
      # South side near Reid, returning to the west-side approach.
      - { latitude: -31.9792471, longitude: 115.8183038 }
      - { latitude: -31.9792562, longitude: 115.8181809 }
      - { latitude: -31.9792334, longitude: 115.8180312 }
