routes:
  - id: full-campus-loop
    name: Campus loop
    colour: "#D4741F"
    loop: true
    stops: [reid-library, ezone-central, civ-mech, guild-village, barry-marshall, sports-science, business-school, bilya-marlee, marine-research]

  - id: eng-business-loop
    name: Engineering to Business School loop
    colour: "#1F7FD4"
    loop: true
    stops: [civ-mech, guild-village, barry-marshall, sports-science, business-school, bilya-marlee]
    
  - id: nth-south
    name: Full length of campus North - South and back
    colour: "#2E7D32"
    loop: false
    stops: [reid-library, guild-village, sports-science, barry-marshall]
  
  - id: james-oval-loop
    name: Loop around James oval
    colour: "#C2185B"
    loop: true
    stops: [civ-mech, ezone-central, reid-library, guild-village]

  - id: library-service
    name: Direct service to 3 highest use libraries
    colour: "#6A1B9A"
    loop: true
    stops: [reid-library, law-library, guild-village, barry-marshall]

  # Demo 1. Point-to-point. The hidden path points follow the corrected
  # client sketch. Only Business School, Bayliss Building and the Robotics Lab
  # are visible markers; the extra points exist only to turn at path corners.
  - id: demo-business-robotics
    name: "Demo: Business School → Bayliss → Robotics"
    colour: "#7C3AED"
    loop: false
    hide_other_stops: true
    stops: [business-school, bayliss-building, robotics-lab]
    path:
      # South end beside the Business School, then north along the campus path.
      - { latitude: -31.9859447, longitude: 115.8201492 }
      - { latitude: -31.9849615, longitude: 115.8201922 }
      - { latitude: -31.9848796, longitude: 115.8201492 }
      - { latitude: -31.9848887, longitude: 115.8194830 }
      - { latitude: -31.9848432, longitude: 115.8188383 }
      - { latitude: -31.9848068, longitude: 115.8187739 }
      # Hidden corner points keep the line on the north/south pedestrian route.
      - { latitude: -31.9840239, longitude: 115.8187309 }
      - { latitude: -31.9835505, longitude: 115.8188383 }
      - { latitude: -31.9827312, longitude: 115.8188061 }
      - { latitude: -31.9824217, longitude: 115.8187416 }
      - { latitude: -31.9810652, longitude: 115.8187953 }
      # Turn west through the Engineering / James Oval corridor.
      - { latitude: -31.9809651, longitude: 115.8186879 }
      - { latitude: -31.9809651, longitude: 115.8172051 }
      - { latitude: -31.9809105, longitude: 115.8171621 }
      - { latitude: -31.9805827, longitude: 115.8171836 }

  # Demo 2. The visible route is a lollipop-shaped loop: a short approach from
  # IOMRC, one lap around James Oval via Reid, then the same approach back.
  # James Oval itself remains a visible landmark marker but is not a path point.
  - id: demo-james-oval
    name: "Demo: IOMRC → James Oval loop → Reid"
    colour: "#E83EE8"
    loop: true
    hide_other_stops: true
    stops: [marine-research, james-oval, reid-library]
    path:
      # IOMRC approach to the south-west corner of James Oval.
      - { latitude: -31.9813364, longitude: 115.8164763 }
      - { latitude: -31.9813455, longitude: 115.8169414 }
      - { latitude: -31.9813228, longitude: 115.8171980 }
      - { latitude: -31.9808777, longitude: 115.8171820 }
      - { latitude: -31.9806052, longitude: 115.8172087 }
      # Hidden corner points follow the west side of the oval.
      - { latitude: -31.9803281, longitude: 115.8172408 }
      - { latitude: -31.9799830, longitude: 115.8171980 }
      - { latitude: -31.9796968, longitude: 115.8172034 }
      - { latitude: -31.9795969, longitude: 115.8172194 }
      - { latitude: -31.9794425, longitude: 115.8172996 }
      - { latitude: -31.9792972, longitude: 115.8173264 }
      - { latitude: -31.9792745, longitude: 115.8173798 }
      # Across the north side and up to Reid Library.
      - { latitude: -31.9792881, longitude: 115.8182192 }
      - { latitude: -31.9792472, longitude: 115.8182459 }
      - { latitude: -31.9790746, longitude: 115.8182619 }
      - { latitude: -31.9790519, longitude: 115.8183101 }
      - { latitude: -31.9790565, longitude: 115.8183689 }
      # Down the east side and around the south side of James Oval.
      - { latitude: -31.9793471, longitude: 115.8183528 }
      - { latitude: -31.9794788, longitude: 115.8185239 }
      - { latitude: -31.9796741, longitude: 115.8187057 }
      - { latitude: -31.9797695, longitude: 115.8187538 }
      - { latitude: -31.9802282, longitude: 115.8187805 }
      - { latitude: -31.9803917, longitude: 115.8187324 }
      - { latitude: -31.9805189, longitude: 115.8187271 }
      - { latitude: -31.9807142, longitude: 115.8186094 }
      - { latitude: -31.9808777, longitude: 115.8184437 }
      - { latitude: -31.9809912, longitude: 115.8181550 }
      - { latitude: -31.9809912, longitude: 115.8177541 }
      - { latitude: -31.9808187, longitude: 115.8174440 }
      - { latitude: -31.9806415, longitude: 115.8172782 }
      - { latitude: -31.9806052, longitude: 115.8172087 }
      # Retrace the IOMRC approach so the configured route is a loop.
      - { latitude: -31.9808777, longitude: 115.8171820 }
      - { latitude: -31.9813228, longitude: 115.8171980 }
      - { latitude: -31.9813455, longitude: 115.8169414 }
      - { latitude: -31.9813364, longitude: 115.8164763 }

  # Demo 3. Loop-style route following the corrected yellow sketch. The path
  # runs north from Robotics, loops around Great Court, includes the short
  # Andrews/Sunken Garden spur, and retraces the southern approach. Only the
  # named landmarks in stops are visible.
