# Where this Flask app listens, and the public URLs that reach it through
# ngrok (ngrok/ngrok.yml). Served read-only at GET /api/endpoints so the
# dashboard and the rider app can find each other. Optional: without this
# file the app listens on 127.0.0.1:5000 and reports no public URLs.
#
# The port matches `upstream.url` for nuway-api and nuway-dashboard in
# ngrok/ngrok.yml, and `lan.port` in mobile/endpoints.yaml. 5001 rather than
# Flask's default 5000 because macOS AirPlay Receiver holds 5000.

listen:
  host: 127.0.0.1
  port: 5001

public:
  api: https://nuway-api.ngrok.app
  dashboard: https://nuway-dashboard.ngrok.app
  metro: https://nuway-metro.ngrok.app
