<!DOCTYPE html>
<!--
  Administrator sign-in . checked by
  /api/admin/login against config/secrets.yaml.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>nUWAy Admin — Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-name">nuway</span>
      <span class="login-brand-tag">ADMIN</span>
    </div>

    <p class="login-title">Administrator sign-in</p>

    <div class="form-group">
      <label class="form-label" for="login-username">USERNAME</label>
      <input type="text" class="form-input" id="login-username"
             placeholder="admin" autocomplete="username" autocapitalize="none" spellcheck="false">
    </div>

    <div class="form-group">
      <label class="form-label" for="login-password">PASSWORD</label>
      <input type="password" class="form-input" id="login-password"
             placeholder="Enter admin password" autocomplete="current-password">
    </div>

    <div class="login-error" id="login-error">Incorrect username or password. Please try again.</div>

    <button type="button" class="btn-primary" id="btn-login">Sign in</button>

    <!-- A way out for anyone who reached sign-in by mistake, or changed their mind. -->
    <a href="/" class="login-back" id="login-back">Return to dashboard</a>

    <p class="login-note">One shared administrator account &mdash; see the install guide for credentials.</p>
  </div>

  <script src="js/admin-login.js"></script>
</body>
</html>
